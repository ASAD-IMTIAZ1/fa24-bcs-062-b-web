<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="mainpage.css" rel="stylesheet">

    <title>Nike</title>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white">
        <div class="container-fluid navbar-main-div">

            <!-- Left: Nike logo -->
            <a class="navbar-brand" href="#">
                <img src="nike-4-logo-svgrepo-com.svg"
                     alt="Nike logo"
                     id="NavLogo">
            </a>

            <!-- Center: Navigation links -->
            <div class="collapse navbar-collapse"
                 id="navbarSupportedContent">

                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Men</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Women</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Kids</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Jordan</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">NikeSKIMS</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Sport</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Sportswear</a>
                    </li>
                </ul>

            </div>

            <!-- Right: Search -->
            <form class="search-form" role="search">
                <input class="form-control search-input"
                       type="search"
                       placeholder="Search"
                       aria-label="Search">
            </form>

            <!-- Mobile hamburger -->
            <button class="navbar-toggler ms-2"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

        </div>
    </nav>

    <!-- first photo/ hero section -->
    <section class="hero-section-main ">
      <div class="hero-content">
        <h1>
            FULLY INVESTED.
        </h1>
        <p>
            Owned
        </p>
        <button>
            Shop Now
        </button>
      </div>
    </section>


    <!-- slider box / carousel -->
    <section aria-label="Featured shopping categories">
        <div class="carousel-container">
            <div class="featured-card">
                <img src="shopmens.jpg" alt="Men's collection">
                <h3>Shop Men's</h3>
            </div>

            <div class="featured-card">
                <img src="shopwomen.jpg" alt="Women's collection">
                <h3>Shop Women's</h3>
            </div>

            <div class="featured-card">
                <img src="shoplifestyle.jpg" alt="Nike lifestyle collection">
                <h3>Shop Lifestyle</h3>
            </div>
        </div>
    </section>


    <!-- Required for Bootstrap's hamburger/collapse functionality -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>

</body>
</html>
